<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Team Workload</title>
    <link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <div class="workload-container">
      <p class="hint">Current estimated hours by team member</p>
      <div id="workload-list">
        <!-- Populated by JS -->
      </div>

      <div class="chart-section">
        <p class="hint">Team utilisation by week</p>
        <div class="chart-wrapper">
          <canvas id="hoursChart"></canvas>
        </div>
        <p class="note">
          Weekly hours ÷ ((members − 1) × 37.5).<br>
          Cards without a due date use a 14-day window.<br>
          Red line = today.
        </p>
      </div>
    </div>
    <script src="workload.js"></script>
  </body>
</html>
