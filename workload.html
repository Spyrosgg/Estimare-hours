<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Team Workload</title>
    <link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <div class="workload-container">
      <p class="hint">Current estimated hours by team member</p>
      <div id="workload-list">
        <!-- Populated by JS -->
      </div>

      <div class="chart-section">
        <p class="hint">Projected hours / person (today−7 → furthest due date)</p>
        <div class="chart-wrapper">
          <canvas id="hoursChart"></canvas>
        </div>
        <p class="note">
          Total hours ÷ (board members − 1).<br>
          Linear burn-down from today to the latest card due date.
        </p>
      </div>
    </div>
    <script src="js/workload.js"></script>
  </body>
</html>
