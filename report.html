<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Effort Report</title>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Trello SDK -->
  <script src="https://trello.com/power-ups/power-up.min.js"></script>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; padding: 16px; }
    #chart-container { width: 100%; height: 400px; }
    .loading { text-align: center; margin-top: 100px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="chart-container">
      <div class="loading">Loading report...</div>
    </div>
  </div>

  <script>
    (function () {
      window.TrelloPowerUp.ready(function () {
        const t = window.TrelloPowerUp;

        // -------------------- Helper functions --------------------
        // Fetch all cards on the board (including custom fields)
        function fetchCards(t) {
          return t.get('board', 'cards')
            .then(cards => {
              // For each card, we need its plugin data and custom fields (if any)
              const cardPromises = cards.map(card => {
                return Promise.all([
                  Promise.resolve(card),
                  t.get('pluginData', 'effort', { cardId: card.id }),
                  // If you use Trello Custom Fields for start date, fetch them:
                  t.get('card', 'customFieldItems', { cardId: card.id })
                ]);
              });
              return Promise.all(cardPromises);
            })
            .then(results => {
              // results is an array of [card, effortData, customFieldItems]
              return results.map(([card, effortData, customFields]) => {
                // Build a card object with all needed info
                return {
                  id: card.id,
                  name: card.name,
                  due: card.due ? new Date(card.due) : null,
                  idMembers: card.idMembers || [],
                  effort: effortData || {},
                  customFields: customFields || []
                };
              });
            });
        }

        // Extract a start date from custom fields (if you use them)
        // For simplicity, we'll use card creation date if no start field exists.
        function getStartDate(card) {
          // Example: if you have a custom field with id 'startDateFieldId'
          // then you can parse it from card.customFields.
          // Here we just fallback to card creation date.
          // You can modify this to read your own custom field.
          // For now, we assume start = creation date (or due - 7 days if you want)
          // I'll use due - 7 days as a demo start
          if (card.due) {
            const start = new Date(card.due);
            start.setDate(start.getDate() - 7); // assume a 7-day sprint? Adjust as needed
            return start;
          }
          // Fallback: use today - 7 days
          const fallback = new Date();
          fallback.setDate(fallback.getDate() - 7);
          return fallback;
        }

        // -------------------- Main computation --------------------
        function computeReport(cards) {
          // 1. Cumulative effort per member (total across all cards)
          const memberEffort = {};

          // 2. Time-series: total team effort per day/week
          // We'll aggregate by week (starting from earliest start)
          const weekBuckets = {};

          cards.forEach(card => {
            const totalEffortForCard = Object.values(card.effort).reduce((a, b) => a + b, 0);
            if (totalEffortForCard === 0) return; // skip if no effort

            // Add to member cumulative
            for (const [memberId, pct] of Object.entries(card.effort)) {
              memberEffort[memberId] = (memberEffort[memberId] || 0) + pct;
            }

            // Determine start and due dates
            const start = getStartDate(card);
            const due = card.due ? new Date(card.due) : new Date(start.getTime() + 7*24*60*60*1000); // default 7 days

            // Distribute effort evenly across days between start and due
            const totalDays = Math.max(1, Math.ceil((due - start) / (1000*60*60*24)));
            const dailyEffort = totalEffortForCard / totalDays;

            // For each day, add to the week bucket
            let current = new Date(start);
            while (current <= due) {
              // Determine week start (Monday)
              const weekStart = new Date(current);
              weekStart.setDate(current.getDate() - current.getDay() + 1); // Monday
              weekStart.setHours(0,0,0,0);
              const key = weekStart.toISOString().slice(0,10); // YYYY-MM-DD

              weekBuckets[key] = (weekBuckets[key] || 0) + dailyEffort;
              current.setDate(current.getDate() + 1);
            }
          });

          // Sort weeks
          const sortedWeeks = Object.keys(weekBuckets).sort();
          const labels = sortedWeeks;
          const data = sortedWeeks.map(week => Math.round(weekBuckets[week] * 10) / 10);

          return {
            memberEffort,
            labels,
            data
          };
        }

        // -------------------- Render chart --------------------
        function renderChart(labels, data) {
          const ctx = document.createElement('canvas');
          document.getElementById('chart-container').innerHTML = '';
          document.getElementById('chart-container').appendChild(ctx);

          new Chart(ctx, {
            type: 'line',
            data: {
              labels: labels,
              datasets: [{
                label: 'Total Team Effort (sum of %)',
                data: data,
                borderColor: '#0079BF',
                backgroundColor: 'rgba(0, 121, 191, 0.1)',
                tension: 0.2,
                fill: true
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                x: { title: { display: true, text: 'Week Starting' } },
                y: { title: { display: true, text: 'Effort (%)' }, beginAtZero: true }
              },
              plugins: {
                tooltip: {
                  callbacks: {
                    label: function(context) {
                      return `Total effort: ${context.parsed.y}%`;
                    }
                  }
                }
              }
            }
          });
        }

        // -------------------- Main execution --------------------
        fetchCards(t)
          .then(cards => {
            const report = computeReport(cards);
            if (report.labels.length === 0) {
              document.getElementById('chart-container').innerHTML = '<p>No effort data found. Please set effort percentages on your cards.</p>';
              return;
            }
            renderChart(report.labels, report.data);
            // Optionally show member cumulative effort
            // (you could display a table below the chart)
          })
          .catch(err => {
            document.getElementById('chart-container').innerHTML = `<p>Error loading data: ${err.message}</p>`;
          });
      });
    })();
  </script>
</body>
</html>
